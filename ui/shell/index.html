<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cortex</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #171717;
    color: #e5e5e5;
    font: 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  #app { width: 420px; max-width: 90vw; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; color: #fafafa; }
  p.hint { color: #a3a3a3; margin: 0 0 20px; font-size: 12.5px; }
  ul { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li.vault-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    background: #202020;
  }
  li.vault-row .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  li.vault-row .name { font-weight: 500; color: #f5f5f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.vault-row .path { color: #737373; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.vault-row .actions { display: flex; gap: 6px; flex: none; }
  button {
    font: inherit; border: 1px solid rgba(255,255,255,0.12); background: #262626; color: #e5e5e5;
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  button.primary { background: #d4e157; color: #202020; border-color: #d4e157; font-weight: 600; }
  button.subtle { background: transparent; border-color: transparent; color: #a3a3a3; padding: 6px 8px; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 14px; font-size: 12.5px; color: #a3a3a3; min-height: 1.2em; }
  #status.error { color: #f28b82; }
  #empty { color: #737373; font-size: 12.5px; padding: 10px 2px 16px; }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .toolbar #preferences { margin-left: auto; }
  #preferences-panel { margin-top: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: #202020; }
  #preferences-panel[hidden] { display: none; }
  .preference { display: flex; gap: 9px; align-items: flex-start; color: #d4d4d4; font-size: 12px; line-height: 1.35; margin: 9px 0; }
  .preference input { margin-top: 2px; accent-color: #d4e157; }
  .preference-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
</style>
</head>
<body>
  <div id="app">
    <h1>Cortex</h1>
    <p class="hint">Choose a vault to open, or add a new one.</p>
    <div id="empty" hidden>No vaults registered yet.</div>
    <ul id="vault-list"></ul>
    <div class="toolbar">
      <button id="add-vault" class="primary">Add vault…</button>
      <button id="preferences" class="subtle" aria-expanded="false">Preferences</button>
    </div>
    <section id="preferences-panel" aria-label="Preferences" hidden>
      <strong>Preferences</strong>
      <label class="preference"><input id="open-last-vault" type="checkbox" /> <span>Open the last active vault when Cortex starts.</span></label>
      <label class="preference"><input id="show-tray-icon" type="checkbox" /> <span>Show Cortex in the menu bar.</span></label>
      <div class="preference-actions">
        <button id="cancel-preferences" class="subtle">Cancel</button>
        <button id="save-preferences" class="primary">Save</button>
      </div>
    </section>
    <div id="status"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
